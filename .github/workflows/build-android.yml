name: Build Android App

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

env:
  TAURI_PROJECT_PATH: InkWell-Desktop
  NDK_VERSION: '27.0.12077973'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to attach the APK/AAB to the GitHub Release
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Install npm dependencies
        working-directory: ${{ env.TAURI_PROJECT_PATH }}
        run: npm ci

      # Only runs if src-tauri/gen/android/ isn't already in the repo --
      # once you've done the one-time signed-build setup (SETUP.md) and
      # committed that folder, this step is a no-op, so it never
      # overwrites your manual build.gradle.kts signing-config edit.
      - name: Initialize Android project (first time only)
        if: ${{ hashFiles(format('{0}/src-tauri/gen/android/**', env.TAURI_PROJECT_PATH)) == '' }}
        working-directory: ${{ env.TAURI_PROJECT_PATH }}
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: npx tauri android init

      - name: Set up signing (only if keystore secrets exist)
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' }}
        working-directory: ${{ env.TAURI_PROJECT_PATH }}/src-tauri/gen/android
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Build Android APK + AAB
        working-directory: ${{ env.TAURI_PROJECT_PATH }}
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: npx tauri android build

      - name: Upload build artifacts (workflow run only -- quick access, expires after 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: inkwell-android
          path: |
            ${{ env.TAURI_PROJECT_PATH }}/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            ${{ env.TAURI_PROJECT_PATH }}/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

      # This is what actually makes it show up on the Releases page --
      # the step above only attaches it to this one workflow run, which
      # isn't visible from Releases at all. Creates the release if the
      # desktop workflow hasn't finished yet, or attaches to the
      # existing one (matched by tag) if it has -- order between the
      # two workflows doesn't matter either way. Tag-only, since
      # workflow_dispatch runs aren't attached to a release.
      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ${{ env.TAURI_PROJECT_PATH }}/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            ${{ env.TAURI_PROJECT_PATH }}/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
