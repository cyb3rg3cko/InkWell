name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you trigger a rebuild manually from the Actions tab, no new commit needed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed to push to GitHub Container Registry
    strategy:
      matrix:
        include:
          - install_stt: "0"
            tag: latest
          - install_stt: "1"
            tag: latest-stt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires the image name to be lowercase -- github.repository
      # preserves whatever case your GitHub username/repo actually use,
      # which silently breaks the push if either has capitals.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            INSTALL_STT=${{ matrix.install_stt }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ matrix.tag }}
          cache-from: type=gha,scope=stt-${{ matrix.install_stt }}
          cache-to: type=gha,mode=max,scope=stt-${{ matrix.install_stt }}
