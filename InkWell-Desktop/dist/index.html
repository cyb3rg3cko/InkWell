<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InkWell</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1b1a17;
    color: #eae6df;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a { color: #7fa8bb; }
</style>
</head>
<body>
  <div id="fallback" style="display:none;">
    Redirecting to InkWell&hellip;
    <br>
    If nothing happens, <a id="fallback-link" href="#">click here</a>.
  </div>
  <script>
    var SERVER_URL = "https://inkwell.thebrokenrim.com";
    document.getElementById("fallback-link").href = SERVER_URL;
    // Show the fallback link only if the redirect hasn't fired shortly --
    // covers the rare case where navigation is blocked for some reason,
    // so it's never a dead end with no way forward.
    setTimeout(function () {
      document.getElementById("fallback").style.display = "block";
    }, 1500);
    window.location.href = SERVER_URL;
  </script>
</body>
</html>
